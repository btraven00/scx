name: Python

# Builds scx-picklerick wheels + sdist and tests each wheel against PyPI's
# anndata/h5py (which bundle their own libhdf5 next to our static copy).
# Publishing is manual: download the `dist` artifact from a run and
# `uv publish dist/*`.

on:
  pull_request:
    paths:
      - "python/picklerick/**"
      - "crates/scx-core/**"
      - "tests/fixtures/**"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    tags: ["picklerick-v*"]
  workflow_dispatch:

jobs:
  wheel:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            manylinux: "2_28"
          - os: macos-14
            manylinux: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: PyO3/maturin-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          working-directory: python/picklerick
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --out dist
          sccache: true
      - name: Test the built wheel
        run: |
          python -m pip install python/picklerick/dist/*.whl pytest scipy
          python -m pytest python/picklerick/tests -q -rs
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: python/picklerick/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python/picklerick
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/picklerick/dist/*.tar.gz

  dist:
    name: collect dist
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
