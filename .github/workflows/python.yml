name: Python

# Builds scx-picklerick wheels + sdist and tests each wheel against PyPI's
# anndata/h5py (which bundle their own libhdf5 next to our static copy).
# Publishing is manual: download the `dist` artifact from a run and
# `uv publish dist/*`.

on:
  pull_request:
    paths:
      - "python/picklerick/**"
      - "crates/scx-core/**"
      - "tests/fixtures/**"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    tags: ["picklerick-v*"]
  workflow_dispatch:

jobs:
  wheel:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            manylinux: "2_28"
          - os: macos-14
            manylinux: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: PyO3/maturin-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          working-directory: python/picklerick
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --out dist
          sccache: true
      - name: Test the built wheel
        run: |
          python -m pip install python/picklerick/dist/*.whl pytest scipy
          python -m pytest python/picklerick/tests -q -rs
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: python/picklerick/dist/*.whl

  # Coverage of the Python package and of the bindings' Rust (lib.rs), both
  # exercised by pytest. scx-core lines hit along the way are dropped from
  # the lcov: they belong to the `rust` flag, measured by ci.yml.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install system HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - name: Build instrumented extension and run pytest
        run: |
          python -m venv .venv && . .venv/bin/activate
          pip install "maturin>=1.9,<2" pytest pytest-cov scipy anndata
          eval "$(cargo llvm-cov show-env --export-prefix)"
          export CARGO_TARGET_DIR=$CARGO_LLVM_COV_TARGET_DIR
          maturin develop --manifest-path python/picklerick/Cargo.toml --no-default-features
          pytest python/picklerick/tests -q --cov=picklerick --cov-report=xml:python-coverage.xml
          cargo llvm-cov report --lcov --output-path python-rust.lcov --ignore-filename-regex 'crates/'
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./python-coverage.xml,./python-rust.lcov
          flags: python
          name: python-coverage
          fail_ci_if_error: false

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python/picklerick
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/picklerick/dist/*.tar.gz

  dist:
    name: collect dist
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
