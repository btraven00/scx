name: Conda Package

# Pushes to main publish to the `edge` channel. A release is published to
# `almost-conductor` by running this with the release tag: release-please.yml
# does that after creating a release (its tags can't trigger workflows), and it
# can be run by hand, e.g. `gh workflow run conda-package.yml -f tag=scx-cli-v0.4.1`.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish to almost-conductor, e.g. scx-cli-v0.4.1"
        required: true

env:
  RATTLER_BUILD_VERSION: "0.31.1"

jobs:
  build:
    name: Build ${{ matrix.recipe }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        recipe: [scx, picklerick-python, r-picklerick]
        platform:
          - os: ubuntu-latest
            target: linux-64
          - os: macos-latest
            target: osx-arm64
          - os: windows-latest
            target: win-64
        exclude:
          # R + rust + HDF5 on Windows is not yet wired up.
          - recipe: r-picklerick
            platform: { os: windows-latest, target: win-64 }
          # maturin + HDF5-linked PyO3 ext on Windows: revisit after Linux/macOS land.
          - recipe: picklerick-python
            platform: { os: windows-latest, target: win-64 }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        shell: bash
        run: |
          # From release-please's tags (the three packages share a version):
          # scx-cli-v0.4.1-0-gabcdef → 0.4.1       (the release commit)
          # scx-cli-v0.4.1-5-gabcdef → 0.4.1.post5 (5 commits after it)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          RAW=$(git describe --tags --long --match 'scx-cli-v*' 2>/dev/null \
                || echo "scx-cli-v0.0.0-${COMMIT_COUNT}-g$(git rev-parse --short HEAD)")
          RAW=${RAW#scx-cli-v}
          TAG=$(echo "$RAW" | sed 's/-.*//')
          N=$(echo "$RAW"   | sed 's/[^-]*-//' | cut -d- -f1)
          if [ "$N" = "0" ]; then
            VERSION="$TAG"
          else
            VERSION="${TAG}.post${N}"
          fi
          echo "SCX_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version: $VERSION"

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.5.0
        with:
          pixi-version: latest
          run-install: false

      - name: Install rattler-build
        run: |
          pixi global install rattler-build==${{ env.RATTLER_BUILD_VERSION }}

      - name: Build conda package
        shell: bash
        run: |
          # Output dir MUST be outside the source tree, or rattler-build
          # recurses into its own work dir while copying the path source
          # and fails with ENAMETOOLONG (upstream issue #2045).
          rattler-build build --recipe conda.recipe/${{ matrix.recipe }}/recipe.yaml \
            --output-dir "${RUNNER_TEMP}/rattler-output" \
            --target-platform ${{ matrix.platform.target }} \
            --channel conda-forge --channel bioconda

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.recipe }}-${{ matrix.platform.target }}
          path: ${{ runner.temp }}/rattler-output/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to prefix.dev
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.5.0
        with:
          pixi-version: latest
          run-install: false

      - name: Install rattler-build
        run: |
          pixi global install rattler-build==${{ env.RATTLER_BUILD_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Upload to prefix.dev (edge)
        run: |
          for pkg in $(find artifacts/ -type f \( -name "*.conda" -o -name "*.tar.bz2" \)); do
            echo "Uploading ${pkg}"
            if ! output=$(rattler-build upload prefix -c edge "${pkg}" 2>&1); then
              if echo "$output" | grep -q "409"; then
                echo "Already exists, skipping: ${pkg}"
              else
                echo "$output" && exit 1
              fi
            fi
          done

      - name: Upload to prefix.dev (stable, releases only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          for pkg in $(find artifacts/ -type f \( -name "*.conda" -o -name "*.tar.bz2" \)); do
            echo "Uploading ${pkg}"
            if ! output=$(rattler-build upload prefix -c almost-conductor "${pkg}" 2>&1); then
              if echo "$output" | grep -q "409"; then
                echo "Already exists, skipping: ${pkg}"
              else
                echo "$output" && exit 1
              fi
            fi
          done
