name: Docs

# Renders the docs site with scripts/render_docs.sh, which runs every code
# chunk, so a broken example fails this check. Pushes to main also deploy it
# to GitHub Pages (Settings -> Pages -> Source must be "GitHub Actions").

on:
  pull_request:
    paths:
      - "site/**"
      - "r/picklerick/**"
      - "python/picklerick/**"
      - "crates/**"
      - "tests/fixtures/**"
      - "Cargo.lock"
      - "rproject.toml"
      - "rv.lock"
      - "scripts/render_docs.sh"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on the self-hosted omnibenchmark machine, set up by the lab's
  # github_runner Ansible play: Posit's R 4.5.3 in /opt/R, plus cmake, Quarto
  # and rv. R packages come from rproject.toml and rv.lock, as locally. The
  # caches live outside the checkout, which is cleaned on every run. Skipped
  # for pull requests from forks, which shouldn't run code on a shared lab
  # machine.
  build:
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    env:
      CARGO_HOME: /opt/cache/runner/scx/cargo
      RUSTUP_HOME: /opt/cache/runner/scx/rustup
      RV_GLOBAL_CACHE_DIR: /opt/cache/runner/scx/rv
      PIP_CACHE_DIR: /opt/cache/runner/scx/pip
    steps:
      - uses: actions/checkout@v7
      # Ahead of the host's /usr/local R, which has no graphics devices for
      # knitr to render the R chunks with.
      - run: echo "/opt/R/4.5.3/bin" >> "$GITHUB_PATH"
      # So rust-toolchain finds the rustup an earlier run installed.
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      # render_docs.sh uses this library, and installs picklerick into it
      # built against the in-tree scx-core.
      - name: R packages
        run: rv sync
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Docs venv
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/pip install -r site/requirements.txt
      - name: Render
        run: scripts/render_docs.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
