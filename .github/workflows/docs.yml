name: Docs

# Renders the docs site with scripts/render_docs.sh, which runs every code
# chunk, so a broken example fails this check, and deploys it to GitHub Pages
# (Settings -> Pages -> Source must be "GitHub Actions").
#
# Runs on merges to main (and by hand), not on pull requests: it needs the
# single self-hosted runner, which pull requests were queueing behind. Run it
# on a branch with workflow_dispatch to check the docs before merging.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on the self-hosted omnibenchmark machine, set up by the lab's
  # github_runner Ansible play: Posit's R 4.5.3 in /opt/R, plus cmake, Quarto
  # and rv. R packages come from rproject.toml and rv.lock, as locally. The
  # caches live outside the checkout, which is cleaned on every run. Skipped
  # for pull requests from forks, which shouldn't run code on a shared lab
  # machine.
  build:
    runs-on: self-hosted
    env:
      CARGO_HOME: /opt/cache/runner/scx/cargo
      RUSTUP_HOME: /opt/cache/runner/scx/rustup
      # Compile cache for Rust and for HDF5's C build (sccache from the play).
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_DIR: /opt/cache/runner/scx/sccache
      SCCACHE_CACHE_SIZE: 20G
      # sccache can't cache incremental builds (the workspace crates in dev
      # profiles, e.g. clippy and test).
      CARGO_INCREMENTAL: "0"
      # The docs run examples on tiny fixtures, so the three builds (CLI, R
      # package, Python package) optimise for build time, not speed: no LTO,
      # parallel codegen. That is most of their link time, which sccache
      # can't cache (an scx-core change: CLI 110 s -> 16 s). Overrides the
      # release profile for this job only; shipped builds keep LTO.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # One build dir for all three, kept between runs (the checkout is
      # cleaned), so unchanged crates and HDF5's CMake build are reused.
      CARGO_TARGET_DIR: /opt/cache/runner/scx/target-docs
      # Per R build: packages compiled against one R don't load in another,
      # and rv keys its cache by R version only. Change with /opt/R/<version>.
      RV_CACHE_DIR: /opt/cache/runner/scx/rv/posit-4.5.3
      PIP_CACHE_DIR: /opt/cache/runner/scx/pip
    steps:
      - uses: actions/checkout@v7
      # ponytail: cleared wholesale past 40 GB; prune by age if that recurs often.
      - name: Cap the kept build dir
        run: |
          if [ -d "$CARGO_TARGET_DIR" ] && [ "$(du -s --block-size=1G "$CARGO_TARGET_DIR" | cut -f1)" -gt 40 ]; then
            rm -rf "$CARGO_TARGET_DIR"
          fi
      # Ahead of the host's /usr/local R, which has no graphics devices for
      # knitr to render the R chunks with.
      - run: echo "/opt/R/4.5.3/bin" >> "$GITHUB_PATH"
      # So rust-toolchain finds the rustup an earlier run installed.
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      # render_docs.sh uses this library, and installs picklerick into it
      # built against the in-tree scx-core.
      - name: R packages
        run: rv sync
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Docs venv
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/pip install -r site/requirements.txt
      - name: Render
        run: scripts/render_docs.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site
      - name: sccache hit rate
        if: always()
        run: sccache --show-stats

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
