name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test & Lint (${{ matrix.hdf5 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default build path: vendored static HDF5 + zlib. No system libhdf5
          # needed. This is what cargo install / wheels / source-tree users get.
          - hdf5: vendored
            cargo_flags: ""
            apt_packages: ""
          # Conda + distro packager path: link the system libhdf5.
          - hdf5: system
            cargo_flags: "--no-default-features"
            apt_packages: "libhdf5-dev"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system HDF5
        if: matrix.apt_packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.hdf5 }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.hdf5 }}-

      - name: fmt
        if: matrix.hdf5 == 'vendored'
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets ${{ matrix.cargo_flags }} -- -D warnings

      - name: test
        env:
          HDF5_USE_FILE_LOCKING: "FALSE"
        run: cargo test --all ${{ matrix.cargo_flags }}

  # Coverage baseline. Runs against system HDF5 (fast: skips the from-source
  # vendored build). Report-only for now — set `--fail-under-lines N` from the
  # first run's reported % to turn this into a no-regression ratchet.
  coverage:
    name: Coverage (system HDF5)
    runs-on: ubuntu-latest
    # Report-only baseline: some scx-cli integration tests shell out to the
    # binary and don't run cleanly under llvm-cov's relocated target dir. Don't
    # let that gate CI until the job is hardened.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install system HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage summary
        env:
          HDF5_USE_FILE_LOCKING: "FALSE"
        run: cargo llvm-cov --all --no-default-features --summary-only
