name: R

on:
  pull_request:
    paths:
      - "r/picklerick/**"
      - "crates/scx-core/**"
      - "tests/fixtures/**"
      - "rproject.toml"
      - "rv.lock"
      - ".github/workflows/r.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # covr over the testthat suite. Tests that need generated golden files skip;
  # SCX_ROOT points them at the repo's tracked fixtures, since covr runs the
  # tests from a temporary copy of the package.
  coverage:
    runs-on: ubuntu-latest
    env:
      SCX_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Build the R crate against the in-tree scx-core rather than the
      # crates.io release it names, so core changes are tested here before a tag.
      - name: Patch scx-core to the checkout
        run: |
          printf '[patch.crates-io]\nscx-core = { path = "%s/crates/scx-core" }\n' "$GITHUB_WORKSPACE" >> ~/.cargo/config.toml
          cargo tree --manifest-path r/picklerick/src/rust/Cargo.toml -p scx-core --depth 0 | grep -F "($GITHUB_WORKSPACE/crates/scx-core)"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/picklerick
          extra-packages: any::covr, any::xml2
          needs: coverage
      - name: Coverage
        run: |
          cov <- covr::package_coverage("r/picklerick", type = "tests", quiet = FALSE)
          print(cov)
          covr::to_cobertura(cov, "r-coverage.xml")
        shell: Rscript {0}
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./r-coverage.xml
          flags: r
          name: r-coverage
          fail_ci_if_error: false

  # R CMD check, then a guard that the committed man/ and NAMESPACE are what
  # roxygen generates from the comments in R/.
  #
  # Runs on the self-hosted omnibenchmark machine, set up by the lab's
  # github_runner Ansible play: Posit's R 4.5.3 in /opt/R, plus cmake and rv.
  # R packages come from rproject.toml and rv.lock, as locally. The caches
  # live outside the checkout, which is cleaned on every run. Skipped for pull
  # requests from forks, which shouldn't run code on a shared lab machine.
  check:
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    env:
      CARGO_HOME: /opt/cache/runner/scx/cargo
      RUSTUP_HOME: /opt/cache/runner/scx/rustup
      # Compile cache for Rust and for HDF5's C build (sccache from the play).
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_DIR: /opt/cache/runner/scx/sccache
      SCCACHE_CACHE_SIZE: 20G
      # sccache can't cache incremental builds (the workspace crates in dev
      # profiles, e.g. clippy and test).
      CARGO_INCREMENTAL: "0"
      RV_GLOBAL_CACHE_DIR: /opt/cache/runner/scx/rv
      # What r-lib/actions sets for R CMD check on GitHub's runners.
      NOT_CRAN: "true"
      TZ: UTC
      _R_CHECK_CRAN_INCOMING_: "false"
      _R_CHECK_SYSTEM_CLOCK_: "FALSE"
    steps:
      - uses: actions/checkout@v7
      # Ahead of the host's /usr/local R, which has no graphics devices for
      # knitr to render the vignettes with.
      - run: echo "/opt/R/4.5.3/bin" >> "$GITHUB_PATH"
      # So rust-toolchain finds the rustup an earlier run installed.
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      # Overwritten, not appended to: CARGO_HOME persists between runs.
      - name: Patch scx-core to the checkout
        run: |
          printf '[patch.crates-io]\nscx-core = { path = "%s/crates/scx-core" }\n' "$GITHUB_WORKSPACE" > "$CARGO_HOME/config.toml"
      - name: R packages
        run: |
          rv sync
          echo "R_LIBS=$GITHUB_WORKSPACE/$(rv library)" >> "$GITHUB_ENV"
      - name: R CMD check
        working-directory: ${{ runner.temp }}
        run: |
          R CMD build "$GITHUB_WORKSPACE/r/picklerick"
          R CMD check --no-manual --as-cran picklerick_*.tar.gz
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: picklerick-Rcheck
          path: ${{ runner.temp }}/picklerick.Rcheck
      # After the check, so the in-place build roxygen triggers is not
      # bundled into the package tarball the check builds.
      - name: man/ and NAMESPACE match the roxygen comments
        run: |
          Rscript -e 'roxygen2::roxygenise("r/picklerick")'
          stale=$(git status --porcelain -- r/picklerick/man r/picklerick/NAMESPACE)
          if [ -n "$stale" ]; then
            echo "Run roxygen2::roxygenise(\"r/picklerick\") and commit the result:"
            echo "$stale"
            exit 1
          fi
      - name: sccache hit rate
        if: always()
        run: sccache --show-stats
