context:
  name: scx
  # SCX_VERSION is set by CI from `git describe`; fallback for local builds.
  version: ${{ env.get("SCX_VERSION", default="0.0.0.dev0") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../../
  use_gitignore: true

build:
  number: 0
  script:
    # --no-default-features disables vendored-hdf5; conda provides libhdf5
    # in the host env, so link dynamically against that instead of building
    # a second copy from source.
    - if: unix
      then:
        - export HDF5_DIR="$PREFIX"
        - export CARGO_TARGET_DIR="/tmp/scx-build"
        - cargo install --path crates/scx-cli --root "$PREFIX" --locked --no-default-features
    - if: win
      then:
        - set "HDF5_DIR=%LIBRARY_PREFIX%"
        - set "CARGO_TARGET_DIR=%TEMP%\scx-build"
        - cargo install --path crates/scx-cli --root "%PREFIX%" --locked --no-default-features

requirements:
  build:
    - ${{ compiler('rust') }}
    - if: unix
      then: pkg-config
  # Same HDF5 as picklerick-python (and conda-forge's current global pin), so
  # the two packages can be installed into one environment.
  host:
    - hdf5 1.14.*
  run:
    - hdf5 1.14.*

tests:
  - script:
      - scx --help

about:
  homepage: https://github.com/btraven00/scx
  license: MIT
  license_file: LICENSE
  summary: "Single-cell streaming interop engine"
  description: |
    scx is a fast, streaming interop engine for single-cell data formats
    (H5Seurat, H5AD, BPCells, etc.), built in Rust.
