context:
  name: scx-capi
  # SCX_VERSION is set by CI from `git describe`; fallback for local builds.
  version: ${{ env.get("SCX_VERSION", default="0.0.0.dev0") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../../
  use_gitignore: true

build:
  number: 0
  script:
    # C ABI library for ScxStream.jl (SCX_CAPI_LIB=$CONDA_PREFIX/lib/libscx_capi.so).
    # --no-default-features links conda's libhdf5 instead of a vendored copy.
    - if: unix
      then:
        - export HDF5_DIR="$PREFIX"
        - export CARGO_TARGET_DIR="/tmp/scx-capi-build"
        - cargo build --release --locked -p scx-capi --no-default-features
        - install -d "$PREFIX/lib"
        # conda's rust activation sets CARGO_BUILD_TARGET, which moves output to target/<triple>/.
        - install -m 755 "$CARGO_TARGET_DIR/${CARGO_BUILD_TARGET:+$CARGO_BUILD_TARGET/}release/libscx_capi${SHLIB_EXT}" "$PREFIX/lib/"
    - if: win
      then:
        - set "HDF5_DIR=%LIBRARY_PREFIX%"
        - set "CARGO_TARGET_DIR=%TEMP%\scx-capi-build"
        - cargo build --release --locked -p scx-capi --no-default-features
        - if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
        - set "OUT=%CARGO_TARGET_DIR%\release"
        - if defined CARGO_BUILD_TARGET set "OUT=%CARGO_TARGET_DIR%\%CARGO_BUILD_TARGET%\release"
        - copy "%OUT%\scx_capi.dll" "%LIBRARY_BIN%\"

requirements:
  build:
    - ${{ compiler('rust') }}
    - if: unix
      then: pkg-config
  # Same HDF5 pin as scx and picklerick-python, so all three share an env.
  host:
    - hdf5 1.14.*
  run:
    - hdf5 1.14.*

tests:
  - package_contents:
      lib:
        - scx_capi

about:
  homepage: https://github.com/btraven00/scx
  license: MIT
  license_file: LICENSE
  summary: "C ABI over scx's chunked matrix stream (used by ScxStream.jl)"
