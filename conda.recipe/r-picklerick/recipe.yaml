context:
  name: r-picklerick
  # SCX_VERSION is set by CI from `git describe`; fallback for local builds.
  version: ${{ env.get("SCX_VERSION", default="0.0.0.dev0") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../../
  use_gitignore: true

build:
  number: 0
  # No HDF5_DIR / system hdf5: scx-core's vendored-hdf5 feature builds HDF5 +
  # zlib from source and bundles them into the staticlib (Rust staticlibs only
  # bundle *static* native deps, and Makevars passes no -lhdf5 — so a dynamic
  # system HDF5 would leave symbols like H5Sselect_elements undefined at load).
  # The from-source build needs cmake (see build requirements).
  script:
    - if: unix
      then:
        - cd r/picklerick
        - R CMD INSTALL --build .
    - if: win
      then:
        - cd r\picklerick
        - R CMD INSTALL --build .

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - if: unix
      then: pkg-config
    - make
  host:
    # No hdf5 here: it is vendored statically into the staticlib (see build
    # script note). zlib is likewise vendored via the hdf5/zlib feature.
    - r-base
    - r-matrix
    - r-jsonlite
    - bioconductor-s4vectors
    - bioconductor-singlecellexperiment
    - bioconductor-summarizedexperiment
  run:
    - r-base
    - r-matrix
    - r-jsonlite
    - bioconductor-s4vectors
    - bioconductor-singlecellexperiment
    - bioconductor-summarizedexperiment

tests:
  - script:
      - R -e "library(picklerick)"

about:
  homepage: https://github.com/btraven00/scx
  license: GPL-3.0-only
  license_file: LICENSE
  summary: "R bindings for the SCX single-cell interop engine"
  description: |
    R bindings to the SCX streaming interop engine for single-cell
    genomics. Converts between H5Seurat, H5AD, and SCX internal formats
    via a memory-bounded streaming pipeline. No Python dependency.
