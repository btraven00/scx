context:
  name: r-picklerick
  # SCX_VERSION is set by CI from `git describe`; fallback for local builds.
  version: ${{ env.get("SCX_VERSION", default="0.0.0.dev0") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../../
  use_gitignore: true

build:
  number: 0
  # HDF5 is Bioconductor's Rhdf5lib, whose static libhdf5.a src/Makevars puts
  # on R's link line (a Rust staticlib does not carry cargo's directives for a
  # library it does not bundle, so a dynamic system hdf5 would leave symbols
  # undefined at load). No hdf5 or cmake here.
  # The R crate depends on scx-core from crates.io; build it against the
  # in-tree crate instead, so the package matches the tagged engine and does not
  # wait for `cargo publish`. The config goes in the work dir, where cargo finds
  # it from r/picklerick/src, and the tree check fails the build if unpatched.
  script:
    - if: unix
      then:
        - mkdir -p .cargo
        - printf '[patch.crates-io]\nscx-core = { path = "%s/crates/scx-core" }\n' "$SRC_DIR" > .cargo/config.toml
        - cargo tree --manifest-path r/picklerick/src/rust/Cargo.toml -p scx-core --depth 0 | grep -F "($SRC_DIR/crates/scx-core)"
        - cd r/picklerick
        - R CMD INSTALL --build .
    - if: win
      then:
        - cd r\picklerick
        - R CMD INSTALL --build .

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - if: unix
      then: pkg-config
    - make
  host:
    # LinkingTo; brings its libcurl, openssl, libaec and zlib along.
    - bioconductor-rhdf5lib >=2.0.0
    - r-base
    - r-matrix
    - r-jsonlite
    - bioconductor-s4vectors
    - bioconductor-singlecellexperiment
    - bioconductor-summarizedexperiment
  run:
    - r-base
    - r-matrix
    - r-jsonlite
    - bioconductor-s4vectors
    - bioconductor-singlecellexperiment
    - bioconductor-summarizedexperiment

tests:
  - script:
      - R -e "library(picklerick)"

about:
  homepage: https://github.com/btraven00/scx
  license: MIT
  license_file: LICENSE
  summary: "R bindings for the SCX single-cell interop engine"
  description: |
    R bindings to the SCX streaming interop engine for single-cell
    genomics. Converts between H5Seurat, H5AD, and SCX internal formats
    via a memory-bounded streaming pipeline. No Python dependency.
