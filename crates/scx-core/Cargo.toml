[package]
name = "scx-core"
version = "0.3.0"
edition = "2021"
description = "Streaming interop engine for single-cell data"
authors = ["btraven <ben.uzh@pm.me>"]
license = "GPL-3.0"
repository = "https://github.com/btraven00/scx"

[features]
default = ["vendored-hdf5"]
# Build HDF5 from source and link it statically along with a vendored zlib.
# Produces self-contained binaries/wheels with no system libhdf5 requirement.
# Distro packagers (conda, debian) can opt out with --no-default-features to
# link against the system HDF5 instead.
vendored-hdf5 = ["hdf5/static", "hdf5/zlib"]
# Network-backed readers (Zarr/Parquet over object_store, 0.4.0). Pulls in the
# tokio runtime so the existing async trait surface gets a real reactor and can
# pipeline cloud I/O (buffer_unordered / tokio::spawn). Off by default: local
# HDF5 conversion stays runtime-free (see docs/tech-debt-async.md). The first
# network reader (Parquet over object_store) lands the format crates here.
net = [
    "dep:tokio",
    "dep:object_store",
    "dep:parquet",
    "dep:arrow",
    "dep:async-stream",
    "dep:url",
    # Backends object_store::parse_url dispatches to. http is mandatory (the
    # Tahoe-100M benchmark is public HTTPS on HuggingFace); aws+gcp for general
    # cloud. azure skipped in v1 to limit dep weight (each pulls reqwest/hyper).
    "object_store/http",
    "object_store/aws",
    "object_store/gcp",
]

[dependencies]
async-trait = "0.1"
futures = "0.3"
hdf5 = { package = "hdf5-metno", version = "0.12" }
hdf5-sys = { package = "hdf5-metno-sys", version = "0.11" }
# Parallel inflate of deflate-chunked HDF5 datasets: read raw chunks via
# H5Dread_chunk (hdf5-sys) and inflate them across cores (rayon) outside
# libhdf5's single-threaded filter pipeline. See h5_chunk.rs.
flate2 = "1"
memmap2 = "0.9"
ndarray = "0.16"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sprs = "0.11"
chrono = "0.4"
thiserror = "2"
tracing = "0.1"
# Async runtime for network-backed readers; enabled by the `net` feature.
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
# Network reader stack (net feature). object_store abstracts S3/GCS/Azure/local/
# in-memory behind one trait; parquet's async reader streams RecordBatches off it;
# arrow gives the columnar batch types we unpack into CSR chunks.
# Pinned to the version parquet's `object_store` feature re-exports, so the
# ObjectStore trait our InMemory/S3 handles satisfy is the same type the
# parquet async reader consumes (a version split would break the trait object).
object_store = { version = "0.13", optional = true }
parquet = { version = "59", features = ["async", "object_store"], optional = true }
arrow = { version = "59", optional = true }
# Lets x_stream() defer the async footer read into the returned Stream (the
# DatasetReader::x_stream signature is sync-returns-stream).
async-stream = { version = "0.3", optional = true }
# URL parsing for the net transport (object_store::parse_url takes a url::Url).
url = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
serde_yaml = "0.9"
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "conversion"
harness = false

[[bench]]
name = "h5_read"
harness = false
