[package]
name = "scx-cli"
version = "0.4.0"
edition = "2021"
description = "Swiss-army knife for single-cell data formats"
authors = ["btraven <ben.uzh@pm.me>"]
license = "GPL-3.0"
repository = "https://github.com/btraven00/scx"

[[bin]]
name = "scx"
path = "src/main.rs"

[features]
default = ["vendored-hdf5"]
vendored-hdf5 = ["scx-core/vendored-hdf5"]
# Network-backed input (Parquet over object_store). Forwards to scx-core/net and
# pulls a tokio runtime so cloud readers get a real reactor at the CLI entry point.
net = ["scx-core/net", "dep:tokio"]

[dependencies]
scx-core = { path = "../scx-core", version = "0.4.0", default-features = false }
# Runtime constructed in main() only under the `net` feature.
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
owo-colors = { version = "4", features = ["supports-colors"] }
polars = { version = "0.46", default-features = false, features = ["csv", "parquet", "dtype-categorical"] }

[dev-dependencies]
tempfile = "3"
# Build a Tahoe-shaped Parquet fixture in the net e2e test (gated by cfg(net)).
arrow = "59"
parquet = "59"
