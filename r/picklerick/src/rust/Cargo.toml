[package]
name    = "picklerick-r"
version = "0.0.3"
edition = "2021"

# This crate is NOT part of the top-level Cargo workspace.
# It is compiled separately by R's build system (src/Makevars) when native
# bindings are activated. scx-core comes from crates.io like every other
# dependency.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
extendr-api = "0.7"
# No vendored-hdf5: HDF5 comes from Rhdf5lib (see ../Makevars), as in rhdf5,
# and its version picks the chunk-read ABI (scx-core/build.rs). No visium-hd
# either: it pulls in parquet. release-please bumps the version with the rest
# of the scx group; CI and the conda recipe patch it to the in-tree crate, so
# main is tested against main (docs/releasing.md).
scx-core    = { version = "0.6.2", default-features = false, features = ["zarr", "bixverse"] } # x-release-please-version
futures     = "0.3"
anyhow      = "1"
serde_json  = "1"

[profile.release]
lto           = true
codegen-units = 1
