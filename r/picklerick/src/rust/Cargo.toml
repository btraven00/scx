[package]
name    = "picklerick-r"
version = "0.0.3"
edition = "2021"

# This crate is NOT part of the top-level Cargo workspace.
# It is compiled separately by R's build system (src/Makevars.in) when
# native bindings are activated.  scx-core is vendored at ./scx-core so
# the package builds in isolation on r-universe (which only ships this
# directory).  Re-sync via r/picklerick/sync-scx-core.sh.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
extendr-api = "0.7"
scx-core    = { path = "./scx-core" }
ndarray     = "0.16"
tokio       = { version = "1", features = ["rt"] }
futures     = "0.3"
anyhow      = "1"
serde_json  = "1"
# Dynamic system HDF5. The workspace flipped to vendored static HDF5 (see
# docs/roadmap.md §0.0.6 "Re-resolution"), but the R package still links
# dynamically because:
#   1. It builds outside the workspace (vendored scx-core in ./scx-core) for
#      r-universe, so the workspace's `vendored-hdf5` feature isn't wired in.
#   2. rhdf5 / hdf5r coexistence under a vendored static libhdf5 has not been
#      validated — switching could regress R session safety.
# TODO: enable vendored-hdf5 here once both are addressed.

[profile.release]
lto           = true
codegen-units = 1
