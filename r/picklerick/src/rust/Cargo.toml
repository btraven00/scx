[package]
name    = "picklerick-r"
version = "0.0.3"
edition = "2021"

# This crate is NOT part of the top-level Cargo workspace.
# It is compiled separately by R's build system (src/Makevars.in) when
# native bindings are activated.  scx-core is vendored at ./scx-core so
# the package builds in isolation on r-universe (which only ships this
# directory).  Re-sync via r/picklerick/sync-scx-core.sh.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
extendr-api = "0.7"
# Vendored scx-core builds HDF5 + zlib statically by default (mirrors the
# workspace's vendored-hdf5 feature flip in commit 5992b9a). This isolates
# picklerick's HDF5 from rhdf5 / hdf5r and avoids ABI drift against the
# system libhdf5 (e.g. H5Literate removed in 1.14+).
scx-core    = { path = "./scx-core" }
ndarray     = "0.16"
tokio       = { version = "1", features = ["rt"] }
futures     = "0.3"
anyhow      = "1"
serde_json  = "1"

[profile.release]
lto           = true
codegen-units = 1
