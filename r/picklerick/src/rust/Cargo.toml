[package]
name    = "picklerick-r"
version = "0.0.3"
edition = "2021"

# This crate is NOT part of the top-level Cargo workspace.
# It is compiled separately by R's build system (src/Makevars) when native
# bindings are activated. scx-core comes from crates.io like every other
# dependency.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
extendr-api = "0.7"
# scx-core builds HDF5 + zlib statically by default (vendored-hdf5 feature),
# isolating picklerick's HDF5 from rhdf5 / hdf5r and avoiding ABI drift against
# the system libhdf5 (e.g. H5Literate removed in 1.14+). release-please bumps
# the version with the rest of the scx group; CI and the conda recipe patch it
# to the in-tree crate, so main is tested against main (docs/releasing.md).
scx-core    = "0.4.1" # x-release-please-version
tokio       = { version = "1", features = ["rt"] }
futures     = "0.3"
anyhow      = "1"
serde_json  = "1"

[profile.release]
lto           = true
codegen-units = 1
