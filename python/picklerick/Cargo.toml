[package]
name = "picklerick-py-native"
version = "0.3.0"
edition = "2021"
# zarrs needs 1.91; checked by the msrv job in ci.yml.
rust-version = "1.91"
description = "PyO3 bindings behind the scx-picklerick Python package"
publish = false

[lib]
name = "picklerick_py_native"
crate-type = ["cdylib"]
path = "rust/src/lib.rs"

[features]
default = ["vendored-hdf5"]
vendored-hdf5 = ["scx-core/vendored-hdf5"]

[dependencies]
anyhow = "1"
futures = "0.3"
pyo3 = { version = "0.29", features = ["extension-module"] }
# Zero-copy handoff of stream chunks: move Rust Vecs into numpy arrays via
# IntoPyArray (numpy takes ownership of the allocation), avoiding the per-chunk
# PyBytes memcpy that bottlenecked open_stream (~355 MB/s). Tracks the pyo3 minor.
numpy = "0.29"
scx-core = { path = "../../crates/scx-core", default-features = false, features = ["zarr"] }
