coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        # Auto-ratchet: fail if project coverage drops more than the threshold
        # below the PR base. Replaces the static --fail-under-lines floor.
        target: auto
        threshold: 1%
      rust:
        flags:
          - rust
        target: auto
        threshold: 1%
    patch:
      default:
        # New/changed lines in a PR must be covered (auto vs base).
        target: auto
        threshold: 1%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "tests/**/*"
  - "docs/**/*"
  - "crates/*/benches/**/*"
  - "python/picklerick/tests/**/*"
  - "r/picklerick/tests/**/*"
  # R package: only its R code is measured (entrypoint.c is a registration stub).
  - "r/picklerick/src/**/*"

# covr writes R paths relative to the package ("R/read.R").
fixes:
  - "R/::r/picklerick/R/"

flags:
  rust:
    paths:
      - crates/
    carryforward: true
  # Python package + the PyO3 bindings' Rust, both driven by pytest
  # (python.yml coverage job).
  python:
    paths:
      - python/
    carryforward: true
  # R code of the R package, via covr (r.yml).
  r:
    paths:
      - r/
    carryforward: true
